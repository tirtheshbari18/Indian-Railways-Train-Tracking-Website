version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: railway_postgres
    restart: always
    environment:
      POSTGRES_USER: railway_user
      POSTGRES_PASSWORD: railway_password_secure
      POSTGRES_DB: railway_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway_user -d railway_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railway_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://railway_user:railway_password_secure@postgres:5432/railway_db
      - SECRET_KEY=national-rail-secret-production-key-998811
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.data.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # 3. React Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railway_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"

volumes:
  postgres_data:
    driver: local
